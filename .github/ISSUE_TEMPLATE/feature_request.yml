name: Feature request
description: Propose an improvement to the Better Codex experience.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Explain the user problem first so different solutions can be evaluated together.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today, and who does it affect?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe how you would like Better Codex to behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share any workarounds or different approaches you have tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, screenshots, examples, or links that clarify the proposal.
