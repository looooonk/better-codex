name: release
run-name: ${{ inputs.release_tag && 'publish' || 'build' }} ${{ inputs.release_tag || inputs.source_ref || github.ref_name }} (${{ inputs.profile }})

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to publish; leave empty for a build without publishing
        type: string
      source_ref:
        description: Full commit SHA or branch to benchmark; defaults to the workflow commit
        type: string
      version:
        description: Expected version; defaults to Cargo.toml
        type: string
      profile:
        description: Compiler configuration (publishing requires release)
        type: choice
        default: release
        options: [release, off16-opt2]
      targets:
        description: Platforms to build
        type: choice
        default: all
        options: [all, intel-mac, apple-silicon, linux-arm]
      intel_builder:
        description: Machine that compiles Intel Mac binaries (packages are tested on Intel)
        type: choice
        default: native
        options: [native, apple-silicon]
      benchmark:
        description: Also measure terminal rendering (Intel Mac only)
        type: boolean
        default: false
      benchmark_only:
        description: Run only terminal-rendering benchmarks (Intel Mac only)
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.release_tag || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || inputs.source_ref || github.sha }}
          persist-credentials: false
      - id: version
        name: Validate release inputs
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
          REQUESTED_VERSION: ${{ inputs.version }}
          PROFILE: ${{ inputs.profile }}
          TARGETS: ${{ inputs.targets }}
          BENCHMARK: ${{ inputs.benchmark }}
          BENCHMARK_ONLY: ${{ inputs.benchmark_only }}
          INTEL_BUILDER: ${{ inputs.intel_builder }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            [[ "${RELEASE_TAG#v}" == "$version" ]]
            [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" && -z "$SOURCE_REF" ]]
            [[ "$PROFILE" == release && "$TARGETS" == all && "$BENCHMARK" == false && "$BENCHMARK_ONLY" == false ]]
          fi
          [[ -z "$REQUESTED_VERSION" || "$REQUESTED_VERSION" == "$version" ]]
          [[ ( "$BENCHMARK" == false && "$BENCHMARK_ONLY" == false ) || "$TARGETS" == intel-mac ]]
          [[ ( "$BENCHMARK" == false && "$BENCHMARK_ONLY" == false ) || "$INTEL_BUILDER" == native ]]
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          python3 - <<'PYTHON'
          import json, os
          matrix = [
              {"runner": "macos-15", "target": "aarch64-apple-darwin"},
              {"runner": "macos-15-intel", "target": "x86_64-apple-darwin"},
              {"runner": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-musl"},
              {"runner": "ubuntu-24.04", "target": "x86_64-unknown-linux-musl"},
          ]
          if os.environ["TARGETS"] == "intel-mac":
              matrix = [matrix[1]]
          elif os.environ["TARGETS"] == "apple-silicon":
              matrix = [matrix[0]]
          elif os.environ["TARGETS"] == "linux-arm":
              matrix = [matrix[2]]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("matrix=" + json.dumps({"include": matrix}), file=output)
          PYTHON

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    uses: ./.github/workflows/release-target.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      build_runner: ${{ inputs.intel_builder == 'apple-silicon' && matrix.target == 'x86_64-apple-darwin' && 'macos-15' || matrix.runner }}
      sha: ${{ needs.validate.outputs.sha }}
      version: ${{ needs.validate.outputs.version }}
      profile: ${{ inputs.profile }}
      benchmark: ${{ inputs.benchmark }}
      benchmark_only: ${{ inputs.benchmark_only }}

  publish:
    if: inputs.release_tag != ''
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Record the tagged source and workflow revisions
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          INTEL_BUILDER: ${{ inputs.intel_builder }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          server = os.environ["GITHUB_SERVER_URL"]
          repository = server + "/" + os.environ["GITHUB_REPOSITORY"]
          workflow = os.environ["GITHUB_WORKFLOW_REF"]
          predicate = {
              "buildDefinition": {
                  "buildType": "https://actions.github.io/buildtypes/workflow/v1",
                  "externalParameters": {"workflow": {
                      "repository": repository,
                      "path": workflow.split("/", 2)[2].split("@", 1)[0],
                      "ref": os.environ["GITHUB_REF"],
                  }, "inputs": {
                      "release_tag": os.environ["RELEASE_TAG"],
                      "intel_builder": os.environ["INTEL_BUILDER"],
                  }},
                  "resolvedDependencies": [
                      {"uri": "git+" + repository + "@" + os.environ["GITHUB_REF"],
                       "digest": {"gitCommit": os.environ["GITHUB_SHA"]}},
                      {"uri": "git+" + repository + "@refs/tags/" + os.environ["RELEASE_TAG"],
                       "digest": {"gitCommit": os.environ["SOURCE_SHA"]}},
                  ],
              },
              "runDetails": {
                  "builder": {"id": server + "/" + workflow},
                  "metadata": {"invocationId": repository + "/actions/runs/"
                      + os.environ["GITHUB_RUN_ID"] + "/attempts/" + os.environ["GITHUB_RUN_ATTEMPT"]},
              },
          }
          with open("provenance.json", "w") as output:
              json.dump(predicate, output)
          PYTHON
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/*.tar.gz
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: provenance.json
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$VERSION" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "v${VERSION}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Better Codex ${VERSION}" \
            --generate-notes \
            --notes "Unsigned macOS preview: Gatekeeper may require approval in System Settings." \
            "${options[@]}"
