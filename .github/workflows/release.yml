name: release
run-name: release ${{ inputs.release_tag || inputs.source_ref || github.ref_name }} (${{ inputs.profile }})

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to publish; leave empty for a build without publishing
        type: string
      source_ref:
        description: Commit or branch to benchmark; defaults to the workflow commit
        type: string
      version:
        description: Expected version; defaults to Cargo.toml
        type: string
      profile:
        description: Compiler configuration (publishing requires release)
        type: choice
        default: release
        options: [release, thin16, off16]
      targets:
        description: Platforms to build
        type: choice
        default: all
        options: [all, intel-mac]
      benchmark:
        description: Also measure terminal rendering (Intel Mac only)
        type: boolean
        default: false
      compiler_cache:
        description: Also cache individual Rust compiler outputs
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.release_tag || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || inputs.source_ref || github.sha }}
          persist-credentials: false
      - id: version
        name: Validate release inputs
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
          REQUESTED_VERSION: ${{ inputs.version }}
          PROFILE: ${{ inputs.profile }}
          TARGETS: ${{ inputs.targets }}
          BENCHMARK: ${{ inputs.benchmark }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            [[ "${RELEASE_TAG#v}" == "$version" ]]
            [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" && -z "$SOURCE_REF" ]]
            [[ "$PROFILE" == release && "$TARGETS" == all && "$BENCHMARK" == false ]]
          fi
          [[ -z "$REQUESTED_VERSION" || "$REQUESTED_VERSION" == "$version" ]]
          [[ "$BENCHMARK" == false || "$TARGETS" == intel-mac ]]
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          python3 - <<'PYTHON'
          import json, os
          matrix = [
              {"runner": "macos-15", "target": "aarch64-apple-darwin"},
              {"runner": "macos-15-intel", "target": "x86_64-apple-darwin"},
              {"runner": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-musl"},
              {"runner": "ubuntu-24.04", "target": "x86_64-unknown-linux-musl"},
          ]
          if os.environ["TARGETS"] == "intel-mac":
              matrix = [matrix[1]]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("matrix=" + json.dumps({"include": matrix}), file=output)
          PYTHON

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    uses: ./.github/workflows/release-target.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      sha: ${{ needs.validate.outputs.sha }}
      version: ${{ needs.validate.outputs.version }}
      profile: ${{ inputs.profile }}
      benchmark: ${{ inputs.benchmark }}
      compiler_cache: ${{ inputs.compiler_cache }}

  publish:
    if: inputs.release_tag != ''
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/*.tar.gz
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$VERSION" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "v${VERSION}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Better Codex ${VERSION}" \
            --generate-notes \
            --notes "Unsigned macOS preview: Gatekeeper may require approval in System Settings." \
            "${options[@]}"
