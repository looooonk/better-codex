name: queue release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start release with shared default-branch caches
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" -f release_tag="$GITHUB_REF_NAME"
