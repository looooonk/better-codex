name: release cache inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            /home/runner/.cargo/registry
            /home/runner/.cargo/git
            /home/runner/work/better-codex/better-codex/codex-rs/target
          key: v0-rust-release-aarch64-unknown-linux-musl-release-Linux-arm64-b2ac58dc-3f6b7735
          fail-on-cache-miss: true
      - name: Inspect cache size
        run: |
          du -h -d 3 /home/runner/.cargo /home/runner/work/better-codex/better-codex/codex-rs/target | sort -h | tail -40
          find /home/runner/.cargo /home/runner/work/better-codex/better-codex/codex-rs/target -type f -size +100M -printf '%s %p\n' | sort -nr | head -30
